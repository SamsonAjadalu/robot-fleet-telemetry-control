name: Validate Robot Fleet

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile backend and ROS sources
        run: python -m compileall -q backend src/robot_bridge
      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
      - name: Validate infrastructure code
        run: |
          npm --prefix infra install
          npm --prefix infra run typecheck
          (cd infra && npx cdk synth FleetDemoUsEast2 --context runService=false > /dev/null)
      - name: Test Redis relay unit behavior
        run: python -m unittest discover -s backend/tests -v
      - name: Start two-instance local stack
        run: docker compose up -d --build
      - name: Test distributed WebSocket routing
        run: |
          python -m pip install "websockets>=12"
          python scripts/test_distributed_websockets.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color api-a api-b postgres redis gateway
      - name: Stop containers
        if: always()
        run: docker compose down -v
