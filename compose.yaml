services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: robot_fleet
      POSTGRES_USER: robot_admin
      POSTGRES_PASSWORD: local_testing_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robot_admin -d robot_fleet"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  api-a: &api
    image: robot-fleet-api:local
    build:
      context: ./backend
    environment: &api_env
      DB_NAME: robot_fleet
      DB_USER: robot_admin
      DB_PASSWORD: local_testing_password
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "true"
      REDIS_CHANNEL: robot-fleet:websocket
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on: &api_dependencies
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck: &api_health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 15

  api-b:
    <<: *api
    environment:
      <<: *api_env
    depends_on: *api_dependencies
    ports:
      - "127.0.0.1:8002:8000"

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"

volumes:
  postgres_data:
